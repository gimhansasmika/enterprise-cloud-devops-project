
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Cloud Portal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;

  <main>
    <h1>Welcome to Enterprise Cloud Portal</h1>
    <p>Deployed on AWS EC2 using Docker and Nginx.</p>
    <p class="status">Web Application: Online</p>

  <footer>
    Enterprise Cloud Project - 2026
  </footer>

</html>
